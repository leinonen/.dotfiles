##### BASIC SETTINGS #####

set -g mouse on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

set-option -g allow-rename off

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

##### DESIGN TWEAKS #####

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour colour226  # Yellow

setw -g mode-style 'fg=colour0,bg=colour196,bold'  # Black on red, bold

set -g pane-border-style 'fg=colour196'           # Red
set -g pane-active-border-style 'fg=colour226'    # Yellow

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour201'                # Magenta

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=colour15,bg=colour199'  # White on DeepPink
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=colour15,bg=colour199'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour199,bg=colour0'
setw -g window-status-format ' #I #[fg=colour15]#W #[fg=colour226]#F '

setw -g window-status-bell-style 'fg=colour15,bg=colour199,bold'

set -g message-style 'fg=colour15,bg=colour199,bold'

##### INDEXING #####

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
