##### BASIC SETTINGS #####
# Enable mouse support (works on tmux 2.1+)
set -g mouse on

# Change prefix from C-b to C-a (more ergonomic)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# vi mode for selecting

set -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# # Split panes using | and - (more intuitive than " and %)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Prevent tmux from renaming windows automatically
set-option -g allow-rename off

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

##### TERMINAL SETTINGS #####
# Enable 256 color support
set -g default-terminal "screen-256color"

# Enable true color support if available
set -ga terminal-overrides ",xterm-256color:Tc"

##### DESIGN TWEAKS #####
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Clock mode color
setw -g clock-mode-colour colour82   # Green

# Mode style (copy mode, etc)
setw -g mode-style 'fg=colour0,bg=colour82,bold'  # Black on green, bold

# Pane borders
set -g pane-border-style 'fg=colour240'           # Mid grey
set -g pane-active-border-style 'fg=colour82'     # Green

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour250,bg=colour235'   # Light grey on dark grey
set -g status-left ''
set -g status-left-length 10
set -g status-right ''

set -g status-interval 5

set -g status-left "  #S "

# Window status
setw -g window-status-current-style 'fg=colour0,bg=colour82'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=colour240,bg=colour235'
setw -g window-status-format ' #I #[fg=colour250]#W #[fg=colour82]#F '
setw -g window-status-bell-style 'fg=colour0,bg=colour82,bold'

# Message style
set -g message-style 'fg=colour0,bg=colour82,bold'

##### INDEXING #####
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set-option -g renumber-windows on

##### PERFORMANCE #####
# Increase scrollback buffer size
set -g history-limit 10000

# Reduce escape time for better vim/neovim experience
set -sg escape-time 0

# Increase display time for pane numbers
set -g display-panes-time 2000

# Increase display time for status messages
set -g display-time 2000
